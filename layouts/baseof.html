<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
{{- if .HasShortcode "gallery" }}
{{ partial "gallery/head.html" . }}
{{- end }}
{{ partial "head.html" . }}
</head>
{{ $bg := resources.Get "images/background.png" }}
<body class="font-serif body-bg" style="{{ if (not .Params.no_background) }}background-image: url('{{ $bg.RelPermalink }}'){{ end }}">
  <header>
    {{ partial "header.html" . }}
  </header>
  <!--<main class="flex flex-col justify-center items-center px-3">-->
  <main class="text-center lg:text-left">
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="flex flex-col items-center py-5">
    {{ partial "footer.html" . }}
  </footer>
</body>
</html>
